name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta lunes y jueves a las 08:00 UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://sgluzymiiejsgfcjzcjy.supabase.co/auth/v1/health" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status Code: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "Ping exitoso. El servicio está activo."
          else
            echo "Error inesperado con código $STATUS"
            exit 1
          fi
