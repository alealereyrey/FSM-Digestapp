name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 08:00 UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -f -X GET "https://sgluzymiiejsgfcjzcjy.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
