<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigestApp - FSM</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #f0f4f8; }
        * { box-sizing: border-box; }
        @media (max-width: 700px) { header { position: static !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // ── 1. CONSTANTES DE LA APP ──────────────────────────────────────────
        const DR={RGS:{color:"#22c55e",bg:"#dcfce7"},ART:{color:"#06b6d4",bg:"#cffafe"},MSS:{color:"#a855f7",bg:"#f3e8ff"},PPJ:{color:"#eab308",bg:"#fef9c3"}};
        const DEF_DOCS=Object.keys(DR).map(function(c){return{code:c,name:"",color:DR[c].color,bg:DR[c].bg,on:"",off:""};});
        const PAL=[{color:"#ef4444",bg:"#fee2e2"},{color:"#3b82f6",bg:"#dbeafe"},{color:"#f97316",bg:"#ffedd5"},{color:"#ec4899",bg:"#fce7f3"},{color:"#14b8a6",bg:"#ccfbf1"},{color:"#84cc16",bg:"#ecfccb"},{color:"#6366f1",bg:"#e0e7ff"},{color:"#78716c",bg:"#f5f5f4"},{color:"#22c55e",bg:"#dcfce7"},{color:"#06b6d4",bg:"#cffafe"},{color:"#a855f7",bg:"#f3e8ff"},{color:"#eab308",bg:"#fef9c3"}];
        var DOCS=DEF_DOCS;
        // Médico activo en una fecha: alta (on) <= fecha < baja (off)
        function docActive(code,s){var d=DOCS.find(function(x){return x.code===code;});if(!d)return false;return(!d.on||s>=d.on)&&(!d.off||s<d.off);}
        function docsOn(s){return DOCS.filter(function(d){return(!d.on||s>=d.on)&&(!d.off||s<d.off);}).map(function(d){return d.code;});}
        function docsCurrent(extra){var t=ld(new Date());var l=DOCS.filter(function(d){return!d.off||d.off>t;}).map(function(d){return d.code;});if(extra&&!l.includes(extra))l.push(extra);return l;}
        // Médicos que se muestran en un día: todos los de la plantilla salvo los ya dados de baja (los aún no incorporados salen deshabilitados)
        function docsShown(s){return DOCS.filter(function(d){return!d.off||d.off>s;}).map(function(d){return d.code;});}
        function docOnTxt(code){var d=DOCS.find(function(x){return x.code===code;});return d&&d.on?"Alta el "+fmtS(d.on):"No activo";}
        function absTxt(ab,code){return ab.k==="free"?"Día libre":ab.k==="off"?docOnTxt(code):"Ausente";}
        function docsAll(){return DOCS.map(function(d){return d.code;});}
        function docName(code){var d=DOCS.find(function(x){return x.code===code;});return d&&d.name?d.name:"";}
        const DK=["mon","tue","wed","thu","fri"];
        const DN=["Lunes","Martes","Miércoles","Jueves","Viernes"];
        const LT=[{c:"VAC",l:"Vacaciones"},{c:"VAA",l:"Vacaciones año anterior"},{c:"DLD",l:"Días libre disposición"},{c:"CON",l:"Congreso"},{c:"FOR",l:"Formación"},{c:"ENF",l:"Enfermedad"},{c:"PRU",l:"Prueba diagnóstica"},{c:"BAJ",l:"Baja laboral"},{c:"ANJ",l:"Ausencia no justificada"},{c:"AUS",l:"Otra ausencia"}];
        const SHL={all:"Día completo",am:"Mañana",pm:"Tarde"};
        const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        const AL={E47:"Endoscopia S47",E46:"Endoscopia S46",C42:"Consulta C42",C43:"Consulta C43",CEN:"Cápsula endoscópica",HDD:"Hospital de día",VIB:"VIB",C4X:"Consulta extra C4X"};
        const BASE_ACTS=["E47","E46","C42","C43","CEN","HDD","VIB"];
        const CATL={endo:"Endoscopia",con:"Consulta",hdd:"Hospital de día",vib:"VIB",otro:"Otra"};
        const CATF=[["all","Todas"],["con","Consultas"],["endo","Endoscopias"],["hdd","Hospital de día"],["otras","Otras (VIB)"]];
        const CORD={endo:0,con:1,hdd:2,vib:3,otro:4};

        // ── 2. HELPERS ───────────────────────────────────────────────────────
        function ld(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
        function p2(n){return String(n).padStart(2,"0");}
        function pl(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12,0,0);}
        function mon(d){var x=new Date(d),w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x;}
        function wkDates(m){return DK.map(function(_,i){var d=new Date(m);d.setDate(d.getDate()+i);return d;});}
        function fmtD(d){return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"});}
        function fmtS(s){return s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";}
        function fmtSS(s){return s?s.slice(8,10)+"/"+s.slice(5,7):"";}
        function dkOf(date){return DK[(date.getDay()+6)%7];}
        function isFTOM(d){return new Date(d).getDay()===4&&new Date(d).getDate()<=7;}
        function mwks(yr,mo){
          var w=[],m=mon(new Date(yr,mo,1));
          for(var i=0;i<7;i++){
            var e=new Date(m);e.setDate(m.getDate()+4);
            if(m.getMonth()===mo||e.getMonth()===mo)w.push(new Date(m));
            m=new Date(m);m.setDate(m.getDate()+7);
            if(m.getMonth()>mo&&m.getFullYear()>=yr)break;
          }
          return w;
        }
        function calcWT(refs,ds){
          if(!refs||!refs.length)return"A";
          var s=refs.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
          var tm=mon(pl(ds));tm.setHours(12,0,0,0);
          var tms=ld(tm),ap=s[0];
          for(var i=0;i<s.length;i++){if(s[i].date<=tms)ap=s[i];else break;}
          if(!ap)return"A";
          var rm=mon(pl(ap.date));rm.setHours(12,0,0,0);
          var dw=Math.round((tm-rm)/(7*24*3600*1000));
          return dw%2===0?ap.type:(ap.type==="A"?"B":"A");
        }
        function actCat(a){
          if(a==="E47"||a==="E46"||a==="CEN")return"endo";
          if(a==="HDD")return"hdd";
          if(a==="VIB")return"vib";
          if(a&&a.charAt(0)==="C")return"con";
          return"otro";
        }
        function catMatch(c,f){if(f==="all")return true;if(f==="otras")return c==="vib"||c==="otro";return c===f;}
        function actName(a){return AL[a]||(a&&a.charAt(0)==="C"?"Consulta "+a:a);}
        function isPmEndo(act,slot){return slot==="pm"&&(act==="E47"||act==="E46");}
        // Pueden marcarse como "extra (pagada)": endoscopias de tarde y cualquier consulta
        function isPayable(act,slot){return isPmEndo(act,slot)||actCat(act)==="con";}
        // Nombre de consulta: siempre en mayúsculas y comenzando por C
        function normC(name){
          var n=(name||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9ÁÉÍÓÚÑ\-]/g,"");
          if(!n)return"";
          if(n.charAt(0)!=="C")n="C"+n;
          return n;
        }

        // Estructura base original (se usa como "semana tipo" inicial)
        function defA(dk,wt){
          var A=wt==="A";
          var b={
            mon:{am:{E47:"RGS",E46:"PPJ",C43:"MSS",HDD:"ART",VIB:"ART"},pm:{C42:"ART",C43:"PPJ",E47:null,E46:null}},
            tue:{am:{E47:"ART",E46:"MSS",C43:"RGS",HDD:"PPJ",VIB:"PPJ"},pm:{C43:"MSS",E47:null,E46:null}},
            wed:{am:{E47:"PPJ",E46:"RGS",C43:"ART",HDD:"MSS",VIB:"MSS"},pm:{C42:"RGS",E47:null,E46:null}},
            thu:{am:{E47:"MSS",E46:"ART",C43:"PPJ",HDD:"RGS",VIB:"RGS"},pm:{}},
            fri:{am:A?{E47:"MSS",E46:"ART",CEN:"ART",C42:"RGS",C43:"PPJ",VIB:null}:{E47:"PPJ",E46:"RGS",CEN:"ART",C42:"ART",C43:"MSS",VIB:null},pm:{}},
          };
          return b[dk]||{am:{},pm:{}};
        }
        function lblFor(dk,wt,slot,act){
          if(dk==="fri"&&slot==="am"){
            if(act==="C43")return wt==="A"?"C43-HEP":"C43-ARI";
            if(act==="C42")return wt==="A"?"C42-EII":"C42-HDX";
          }
          if(dk==="wed"&&slot==="pm"&&act==="C42")return"C42-EII";
          return act;
        }
        function buildDefTpl(){
          var t={};
          ["A","B"].forEach(function(w){
            t[w]={};
            DK.forEach(function(dk){
              var d=defA(dk,w);t[w][dk]={};
              ["am","pm"].forEach(function(sl){
                t[w][dk][sl]=Object.keys(d[sl]).map(function(a){
                  var it={key:a,act:a,label:lblFor(dk,w,sl,a),doc:d[sl][a]};
                  if(isPmEndo(a,sl))it.pay="jornada";
                  return it;
                });
              });
            });
          });
          return t;
        }
        const DEF_TPL=buildDefTpl();
        // Devuelve la semana tipo vigente para una fecha (la versión más reciente con "desde" <= fecha)
        function tplVersion(tps,s){
          var v=null;
          (tps||[]).forEach(function(x){if(x.from<=s&&(!v||x.from>=v.from))v=x;});
          return v;
        }
        function tplFor(tps,s){var v=tplVersion(tps,s);return v?v.tpl:DEF_TPL;}

        // Ausencias: las anuladas nunca cuentan. slot: "am" | "pm" | null (cualquier turno)
        function lvCovers(l,s,slot){
          if(!l||l.cancelled)return false;
          if(!l.startDate||!l.endDate)return false;
          if(!(l.startDate<=s&&l.endDate>=s))return false;
          var sh=l.shift||"all";
          return sh==="all"||!slot||sh===slot;
        }
        // Días libres fijos (p. ej. todos los lunes)
        function fdCovers(f,date,slot){
          if(!f)return false;
          var s=ld(date);
          if(f.weekday!==dkOf(date))return false;
          if(f.from&&s<f.from)return false;
          if(f.to&&s>f.to)return false;
          var sh=f.shift||"all";
          return sh==="all"||!slot||sh===slot;
        }
        // Días hábiles de una ausencia: sin fines de semana ni festivos; aunque sea solo mañana o tarde cuenta 1 día
        function lvDays(l,fes,year){
          if(!l.startDate||!l.endDate||l.endDate<l.startDate)return 0;
          var d=pl(l.startDate),e=pl(l.endDate),n=0,f=1;
          for(;d<=e;d.setDate(d.getDate()+1)){
            var w=d.getDay();
            if(w===0||w===6)continue;
            if(fes.includes(ld(d)))continue;
            if(year&&d.getFullYear()!==year)continue;
            n+=f;
          }
          return n;
        }
        var _askSet=null;
        function ask(msg,onYes,yesLbl){if(_askSet)_askSet({msg:msg,onYes:onYes,yes:yesLbl||"Sí, continuar"});else if(window.confirm(msg))onYes();}
        function AskHost(){
          var [q,setQ]=useState(null);
          useEffect(function(){_askSet=setQ;return function(){_askSet=null;};},[]);
          if(!q)return null;
          return (
            <div style={Object.assign({},S.overlay,{zIndex:3000})}>
              <div style={Object.assign({},S.modal,{maxWidth:400})}>
                <p style={{fontSize:14,color:"#1e293b",margin:"0 0 18px",lineHeight:1.5}}>{q.msg}</p>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button style={S.btnS} onClick={function(){setQ(null);}}>Cancelar</button>
                  <button style={Object.assign({},S.btnP,{background:"#ef4444"})} onClick={function(){var f=q.onYes;setQ(null);f();}}>{q.yes}</button>
                </div>
              </div>
            </div>
          );
        }
        function fmtN(n){return String(n).replace(".",",");}

        // ── 3. CONEXIÓN A SUPABASE ─────────────
        const SUPABASE_URL = "https://sgluzymiiejsgfcjzcjy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_nlmxFYNw-uNjN8nazf0UxA_KWSnsM_3";

        async function sg(k) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/app_memoria?clave=eq.${k}`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                return data.length > 0 && data[data.length - 1].valor ? data[data.length - 1].valor : null;
            } catch(e) { console.error("Error cargando:", e); return null; }
        }

        async function ss(k, v) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/app_memoria`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "resolution=merge-duplicates"
                    },
                    body: JSON.stringify({ clave: k, valor: v })
                });
            } catch(e) { console.error("Error guardando:", e); }
        }

        // ── 4. APLICACIÓN PRINCIPAL ──────────────────────────────────────────
        function App(){
          var now=new Date();
          var [vm,setVm]=useState("week");
          var [cm,setCm]=useState(mon(now));
          var [cy,setCy]=useState(now.getFullYear());
          var [cmo,setCmo]=useState(now.getMonth());
          var [abr,setAbr]=useState([{date:"2025-01-06",type:"A"}]);
          var [ds,setDs]=useState({});
          var [lvs,setLvs]=useState([]);
          var [fes,setFes]=useState([]);
          var [sts,setSts]=useState({});
          var [tps,setTps]=useState([]);   // versiones de la semana tipo
          var [mvs,setMvs]=useState([]);   // traslados de agendas
          var [fds,setFds]=useState([]);   // días libres fijos
          var [docs,setDocs]=useState(DEF_DOCS); // plantilla de médicos
          var [cfg,setCfg]=useState({abOffFrom:""}); // ajustes generales
          // Semanas A/B desactivadas a partir de este lunes (vacío = siempre activas). Antes de esa fecha no cambia nada.
          var abOff=cfg.abOffFrom||(cfg.abOn===false?"2000-01-03":"");
          var abActive=useCallback(function(s){return!abOff||ld(mon(pl(s)))<abOff;},[abOff]);
          var [sdm,setSdm]=useState(false);
          DOCS=docs;
          docs.forEach(function(d){DR[d.code]={color:d.color,bg:d.bg};});
          var [saveInd,setSaveInd]=useState(false);
          var [fil,setFil]=useState({doc:"all",slot:"all",act:"all",sess:true,com:true});
          var [tab,setTab]=useState("dashboard");
          var [slm,setSlm]=useState(false);
          var [el,setEl]=useState(null);
          var [sabm,setSabm]=useState(false);
          var [sfm,setSfm]=useState(false);
          var [sfdm,setSfdm]=useState(false);
          var [sexp,setSexp]=useState(false);
          var [addCtx,setAddCtx]=useState(null);
          var [mvCtx,setMvCtx]=useState(null);
          var [alts,setAlts]=useState([]);
          var [incs,setIncs]=useState([]);
          var dashRef=useRef(null);
          var stimer=useRef(null);
          var [isLoaded, setIsLoaded] = useState(false);

          function sf2(k,v){setFil(function(p){return Object.assign({},p,{[k]:v});});}

          useEffect(function(){
            (async function(){
              var a=await sg("d:ab");if(a)setAbr(a);
              var b=await sg("d:ds");if(b)setDs(b);
              var c=await sg("d:lv");if(c)setLvs(c);
              var d=await sg("d:fe");if(d)setFes(d);
              var e=await sg("d:st");if(e)setSts(e);
              var f=await sg("d:tp");if(f)setTps(f);
              var g=await sg("d:mv");if(g)setMvs(g);
              var h=await sg("d:fd");if(h)setFds(h);
              var i2=await sg("d:dr");if(i2&&i2.length)setDocs(i2);
              var j2=await sg("d:cfg");if(j2)setCfg(j2);
              setIsLoaded(true);
            })();
          },[]);

          useEffect(function(){
            if(!isLoaded) return;
            clearTimeout(stimer.current);
            stimer.current=setTimeout(async function(){
              await ss("d:ab",abr);await ss("d:ds",ds);await ss("d:lv",lvs);await ss("d:fe",fes);await ss("d:st",sts);
              await ss("d:tp",tps);await ss("d:mv",mvs);await ss("d:fd",fds);await ss("d:dr",docs);await ss("d:cfg",cfg);
              setSaveInd(true);setTimeout(function(){setSaveInd(false);},1500);
            },1000);
            return function(){clearTimeout(stimer.current);};
          },[abr,ds,lvs,fes,sts,tps,mvs,fds,docs,cfg,isLoaded]);

          var gwt=useCallback(function(s){return abActive(s)?calcWT(abr,s):"A";},[abr,abActive]);
          var wt=useMemo(function(){return gwt(ld(cm));},[cm,gwt]);
          var wds=useMemo(function(){return wkDates(cm);},[cm]);
          var mwk=useMemo(function(){return mwks(cy,cmo);},[cy,cmo]);

          // ¿El médico no está disponible ese día/turno? -> ausencia activa o día libre
          var gAbs=useCallback(function(doc,date,slot){
            var s=ld(date);
            if(!docActive(doc,s))return{k:"off"};
            var l=lvs.find(function(x){return x.doctor===doc&&lvCovers(x,s,slot);});
            if(l)return{k:"leave",lv:l};
            var f=fds.find(function(x){return x.doctor===doc&&fdCovers(x,date,slot);});
            if(f)return{k:"free",fd:f};
            return null;
          },[lvs,fds,docs]);
          var ife=useCallback(function(date){return fes.includes(ld(date));},[fes]);

          // Agenda de un día = semana tipo vigente + actividades añadidas + traslados + cambios del día
          var ga=useCallback(function(dk,date){
            var s=ld(date),ov=ds[s]||{},w=gwt(s),tpl=tplFor(tps,s);
            var day=(tpl[w]&&tpl[w][dk])||{am:[],pm:[]};
            var out={am:[],pm:[]};
            ["am","pm"].forEach(function(sl){
              var used={};
              var o=ov[sl]||{};
              function push(base){
                if(!base||!base.key||used[base.key])return;
                used[base.key]=1;
                var raw=Object.prototype.hasOwnProperty.call(o,base.key)?o[base.key]:(base.doc===undefined?null:base.doc);
                var it=Object.assign({},base,{slot:sl,rawDoc:raw,cat:actCat(base.act)});
                if(isPayable(base.act,sl)){it.payable=true;it.pmEndo=isPmEndo(base.act,sl);it.pay=(ov.pay&&ov.pay[sl+"_"+base.key])||base.pay||"jornada";}
                var mt=mvs.find(function(m){return m.fromDate===s&&m.fromSlot===sl&&m.key===base.key;});
                if(mt)it.movedTo=mt;
                var r=raw;
                if(raw){var ab=gAbs(raw,date,sl);if(ab)r=ab.k==="leave"?"__LEAVE__":ab.k==="free"?"__FREE__":"__OFF__";}
                it.doc=r;
                out[sl].push(it);
              }
              (day[sl]||[]).forEach(function(b){push(b);});
              if(ov.c4x&&sl==="pm")push({key:"C4X",act:"C4X",label:"C4X",doc:null,extra:true});
              (ov.extra||[]).forEach(function(x){if(x.slot===sl)push({key:x.key,act:x.act,label:x.label||x.key,doc:null,extra:true});});
              mvs.forEach(function(m){if(m.toDate===s&&m.toSlot===sl)push({key:"MV_"+m.id,act:m.act,label:m.label,doc:m.doctor||null,pay:m.pay,movedFrom:m});});
            });
            return out;
          },[ds,gwt,tps,mvs,gAbs]);
          var gst=useCallback(function(s,slot,act){return sts[s+"_"+slot+"_"+act]||null;},[sts]);
          var sst=useCallback(function(s,slot,act,v){setSts(function(p){var k=s+"_"+slot+"_"+act;return Object.assign({},p,{[k]:p[k]===v?null:v});});},[]);

          useEffect(function(){
            var na=[],ni=[];
            var dates=vm==="month"?mwk.reduce(function(a,m){return a.concat(wkDates(m));},[]):wds;
            dates.forEach(function(date){
              var wd=date.getDay();if(wd===0||wd===6)return;
              if(ife(date))return;
              var di=(wd+6)%7,s=ld(date),dk=DK[di],ag=ga(dk,date);
              ["am","pm"].forEach(function(sl){
                ag[sl].forEach(function(it){
                  if(it.movedTo)return;
                  var st=gst(s,sl,it.key);
                  if(st){ni.push({date:s,day:DN[di],slot:sl,act:it.act,label:it.label,cat:it.cat,status:st,doc:it.rawDoc,docState:it.doc});return;}
                  if(it.doc===null||it.doc==="__LEAVE__"||it.doc==="__FREE__"||it.doc==="__OFF__")na.push({date:s,day:DN[di],slot:sl,act:it.act,label:it.label,cat:it.cat,reason:it.doc===null?"Sin designar":it.doc==="__LEAVE__"?"Médico ausente ("+it.rawDoc+")":it.doc==="__OFF__"?it.rawDoc+" ya no está en el servicio":"Día libre de "+it.rawDoc});
                });
              });
            });
            setAlts(na);setIncs(ni);
          },[ds,wds,mwk,lvs,fes,sts,vm,ga,ife,gst]);

          function nwk(d){setCm(function(p){var n=new Date(p);n.setDate(n.getDate()+d*7);return n;});}
          function nmo(d){var m=cmo+d,y=cy;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setCmo(m);setCy(y);}

                  {DN.map(function(d){return <div key={d} style={S.mDL}>{d}</div>;})}
                </div>
                {rows}
                <div style={S.legend}>
                  <span><span style={Object.assign({},S.legSw,{background:"#f59e0b"})}/>Mañana</span>
                  <span><span style={Object.assign({},S.legSw,{background:"#6366f1"})}/>Tarde</span>
                  <span>€ = endoscopia de tarde pagada como extra</span>
                  <span>← trasladada desde otra fecha · → trasladada a otra fecha</span>
                </div>
              </div>
            </div>
          );
        }

        function sortItems(list){
          return list.map(function(x,i){return{x:x,i:i};}).sort(function(a,b){
            var ca=CORD[a.x.cat]||0,cb=CORD[b.x.cat]||0;
            if(ca!==cb)return ca-cb;
            return a.i-b.i;
          }).map(function(o){return o.x;});
        }

        function DCol(p){
          var date=p.date,di=p.di,wt=p.wt,compact=p.compact,dimmed=p.dimmed;
          var s=ld(date),dk=DK[di],fesd=p.ife(date);
          var ag=p.ga(dk,date),sess=p.gs(dk,date,p.ds,wt);
          var isT=ld(new Date())===s;
          var showAM=p.fil.slot==="all"||p.fil.slot==="am";
          var showPM=p.fil.slot==="all"||p.fil.slot==="pm";
          var coms=sess.filter(function(x){return x.type==="committee";});
          var clin=sess.filter(function(x){return x.type==="session";});
          var colSt=Object.assign({},S.dCol,compact?S.dColC:{},dimmed?{opacity:0.4}:{},isT?{border:"2px solid #3b82f6"}:{});
          if(fesd){
            return (
              <div style={colSt}>
                <DHdr date={date} dk={dk} compact={compact}/>
                <div style={S.fesB}><span style={S.fesL}>{compact?"FES":"FESTIVO"}</span></div>
              </div>
            );
          }
          function cells(sl){
            return sortItems(ag[sl]).filter(function(it){return p.fil.act==="all"||it.cat===p.fil.act;}).map(function(it){
              return <AC key={it.key} it={it} s={s} slot={sl} date={date} compact={compact} df={p.fil.doc}
                gst={p.gst} sst={p.sst} sDr={p.sDr} gAbs={p.gAbs} onMove={p.onMove} rmExtra={p.rmExtra} rmMove={p.rmMove} editMove={p.editMove} tPay={p.tPay}/>;
            });
          }
          var amC=cells("am"),pmC=cells("pm");
          var srP={ds:s,tS:p.tSess,tD:p.tSDoc,compact:compact,date:date,gAbs:p.gAbs};
          return (
            <div style={colSt}>
              <DHdr date={date} dk={dk} compact={compact}/>
              {p.fil.com&&coms.length>0&&(
                <div style={S.sec}>
                  {coms.map(function(x){return <SR key={x.id} s={x} {...srP}/>;})}
                </div>
              )}
              {showAM&&(
                <div style={compact?S.amBlkC:S.amBlk}>
                  {!compact&&<div style={S.amLbl}>Mañana</div>}
                  <div style={S.sec}>
                    {p.fil.sess&&clin.filter(function(x){return x.time!=="13:30-14:30";}).map(function(x){return <SR key={x.id} s={x} {...srP}/>;})}
                    {amC.length>0&&<div style={S.twin}>{amC}</div>}
                    {p.fil.sess&&clin.filter(function(x){return x.time==="13:30-14:30";}).map(function(x){return <SR key={x.id} s={x} {...srP}/>;})}
                    {!compact&&<button style={S.addAct} onClick={function(){p.onAddAct(s,"am");}}>+ Añadir actividad</button>}
                  </div>
                </div>
              )}
              {showPM&&(!compact||pmC.length>0)&&(
                <div style={compact?S.pmBlkC:S.pmBlk}>
                  {!compact&&<div style={S.pmLbl}>Tarde</div>}
                  <div style={S.sec}>
                    {pmC.length>0&&<div style={S.twin}>{pmC}</div>}
                    {!compact&&pmC.length===0&&<div style={{fontSize:11,color:"#94a3b8",textAlign:"center",padding:"2px 0"}}>Sin actividad</div>}
                    {!compact&&<button style={S.addAct} onClick={function(){p.onAddAct(s,"pm");}}>+ Añadir actividad</button>}
                  </div>
                </div>
              )}
            </div>
          );
        }

        function DHdr({date,dk,compact}){
          var idx=DK.indexOf(dk);
          return (
            <div style={Object.assign({},S.dHdr,compact?S.dHdrC:{})}>
              <span style={Object.assign({},S.dName,compact?{fontSize:12}:{})}>{compact?date.toLocaleDateString("es-ES",{weekday:"short"}).replace(".",""):DN[idx]}</span>
              <span style={Object.assign({},S.dDate,compact?{fontSize:12}:{})}>{compact?date.getDate():fmtD(date)}</span>
            </div>
          );
        }

        function SR({s,ds,tS,tD,compact,date,gAbs}){
          var isOn=s.active!==false;
          var chips=docsShown(ds).map(function(doc){
            var sel=s.docs&&s.docs.includes(doc),ab=date&&gAbs?gAbs(doc,date,"am"):null;
            return (
              <button key={doc} disabled={!!ab} title={ab?absTxt(ab,doc):""}
                style={Object.assign({},S.dChip,{background:ab?"#f1f5f9":sel?DR[doc].bg:"#f8fafc",borderColor:ab?"#e2e8f0":sel?DR[doc].color:"#d1d5db",color:ab?"#d1d5db":sel?DR[doc].color:"#6b7280",cursor:ab?"not-allowed":"pointer",textDecoration:ab?"line-through":"none",opacity:ab?0.5:1})}
                onClick={function(e){e.stopPropagation();if(!ab)tD(ds,s.id,doc);}}>
                {doc}
              </button>
            );
          });
          return (
            <div style={Object.assign({},S.sRow,{opacity:isOn?1:0.4})}>
              <div style={S.sHdr}>
                <span style={S.sIcon}>{s.type==="committee"?"C":"S"}</span>
                <span style={Object.assign({},S.sLbl,compact?{fontSize:10}:{})}>{compact?s.id:s.label}</span>
                {!compact&&<span style={S.sTime}>{s.time}</span>}
                <button style={Object.assign({},S.togBtn,{background:isOn?"#22c55e":"#94a3b8",marginLeft:"auto"})}
                  onClick={function(e){e.stopPropagation();tS(ds,s.id);}}>
                  {isOn?"ON":"OFF"}
                </button>
              </div>
              {isOn&&!compact&&<div style={S.sDocs}>{chips}</div>}
            </div>
          );
        }

        function AC(p){
          var it=p.it,s=p.s,slot=p.slot,compact=p.compact;
          var [sm,setSm]=useState(false);
          var st=p.gst(s,slot,it.key);
          var doc=it.doc;
          var di=doc&&DR[doc]?DR[doc]:null;
          var isF=p.df!=="all"&&it.rawDoc!==p.df&&doc!==null;
          var mvT=it.movedTo,mvF=it.movedFrom;
          var bg="#f8fafc",bc="#e2e8f0";
          if(mvT){bg="#f1f5f9";bc="#cbd5e1";}
          else if(st==="suspended"){bg="#fef2f2";bc="#fca5a5";}
          else if(st==="nocoverage"){bg="#fff7ed";bc="#fdba74";}
          else if(!doc)bg="#fffbeb";
          else if(doc==="__LEAVE__"||doc==="__FREE__"||doc==="__OFF__")bg="#f1f5f9";
          else if(di){bg=di.bg;bc=di.color+"66";}
          if(mvF&&!st)bc="#0ea5e9";
          var canMove=(it.cat==="con"||it.cat==="hdd")&&!mvF;
          var menuItems=docsShown(s).map(function(d){
            var ab=p.gAbs(d,p.date,slot);
            if(ab)return <div key={d} style={Object.assign({},S.aMItem,{background:"#f1f5f9",opacity:0.55,display:"flex",alignItems:"center",gap:6,cursor:"not-allowed"})}><span style={{color:DR[d].color,fontWeight:700}}>{d}</span><span style={{fontSize:10,color:"#94a3b8"}}>{absTxt(ab,d)}</span></div>;
            return <button key={d} style={Object.assign({},S.aMItem,{background:DR[d].bg})} onClick={function(){p.sDr(s,slot,it.key,d);setSm(false);}}><span style={{color:DR[d].color,fontWeight:700}}>{d}</span></button>;
          });
          var lblTxt=it.label||it.act;
          return (
            <div style={Object.assign({},S.aCell,compact?S.aCellC:{},isF?{opacity:0.25}:{},{background:bg,borderColor:bc,borderStyle:mvF?"dashed":"solid"})}
              onClick={function(){setSm(function(v){return !v;});}}>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <span style={Object.assign({},S.aName,compact?{fontSize:10}:{},mvT?{textDecoration:"line-through",color:"#94a3b8"}:{})}>{lblTxt}</span>
                {it.payable&&it.pay==="extra"&&<span style={S.payX} title="Pagada como extra">€{compact?"":" Extra"}</span>}
                {it.pmEndo&&it.pay!=="extra"&&!compact&&<span style={S.payJ} title="Endoscopia de tarde dentro de la jornada">Jornada</span>}
                {it.extra&&!compact&&<span style={S.addB} title="Actividad añadida solo para este día">+</span>}
              </div>
              {mvF&&<div style={Object.assign({},S.mvF,compact?{fontSize:9}:{})}>{compact?"← "+fmtSS(mvF.fromDate):"← desde "+fmtSS(mvF.fromDate)+" "+(mvF.fromSlot==="am"?"mañana":"tarde")}</div>}
              {mvT&&<div style={Object.assign({},S.mvT,compact?{fontSize:9}:{})}>{compact?"→ "+fmtSS(mvT.toDate):"Anulada → "+fmtSS(mvT.toDate)+" "+(mvT.toSlot==="am"?"mañana":"tarde")}</div>}
              {!mvT&&!st&&di&&<div style={Object.assign({},S.dChipD,{borderColor:di.color},compact?{padding:"1px 5px"}:{})}><span style={{color:di.color,fontWeight:700,fontSize:compact?10:13}}>{doc}</span></div>}
              {!mvT&&!st&&!doc&&<div style={compact?S.unChC:S.unCh}>{compact?"?":"Sin designar"}</div>}
              {!mvT&&!st&&doc==="__LEAVE__"&&<div style={compact?S.lvChC:S.lvCh}>{compact?"Aus":it.rawDoc+" ausente"}</div>}
              {!mvT&&!st&&doc==="__FREE__"&&<div style={compact?S.lvChC:S.lvCh}>{compact?"Lib":it.rawDoc+" libre"}</div>}
              {!mvT&&!st&&doc==="__OFF__"&&<div style={Object.assign({},compact?S.lvChC:S.lvCh,{color:"#991b1b"})}>{compact?"Baja":it.rawDoc+" no activo"}</div>}
              {!mvT&&st==="suspended"&&<div style={Object.assign({},S.stCh,{background:"#fef2f2",color:"#991b1b",borderColor:"#fca5a5"},compact?{fontSize:9,padding:"0 4px"}:{})}>{compact?"Sus":"Suspendida"}</div>}
              {!mvT&&st==="nocoverage"&&<div style={Object.assign({},S.stCh,{background:"#fff7ed",color:"#9a3412",borderColor:"#fdba74"},compact?{fontSize:9,padding:"0 4px"}:{})}>{compact?"NC":"Sin cobertura"}</div>}
              {sm&&(
                <div style={S.aMenu} onClick={function(e){e.stopPropagation();}}>
                  <div style={S.aMT}>{lblTxt} · {slot==="am"?"Mañana":"Tarde"}</div>
                  {mvT?(
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      <div style={{fontSize:12,color:"#475569",padding:"2px 5px"}}>Trasladada al {fmtS(mvT.toDate)} ({mvT.toSlot==="am"?"mañana":"tarde"}){mvT.doctor?" · "+mvT.doctor:""}</div>
                      {mvT.reason&&<div style={{fontSize:11,color:"#64748b",padding:"0 5px"}}>Motivo: {mvT.reason}</div>}
                      <button style={Object.assign({},S.aMSt,{borderColor:"#fca5a5",color:"#991b1b",background:"#fef2f2"})} onClick={function(){p.rmMove(mvT.id);setSm(false);}}>Deshacer traslado</button>
                      <button style={Object.assign({},S.aMSt,{borderColor:"#7dd3fc",color:"#0369a1",background:"#f0f9ff"})} onClick={function(){setSm(false);p.editMove(mvT);}}>Editar traslado</button>
                    </div>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      {mvF&&<div style={{fontSize:11,color:"#0369a1",padding:"0 5px 4px"}}>Trasladada desde el {fmtS(mvF.fromDate)} ({mvF.fromSlot==="am"?"mañana":"tarde"})</div>}
                      {menuItems}
                      <button style={S.aMG} onClick={function(){p.sDr(s,slot,it.key,null);setSm(false);}}>Sin designar</button>
                      <div style={{borderTop:"1px solid #f1f5f9",margin:"5px 0"}}/>
                      {it.payable&&<button style={Object.assign({},S.aMSt,{background:it.pay==="extra"?"#ecfdf5":"#fff7ed",borderColor:it.pay==="extra"?"#86efac":"#fdba74",color:it.pay==="extra"?"#166534":"#9a3412"})} onClick={function(){p.tPay(s,slot,it.key,it.pay);setSm(false);}}>{it.pay==="extra"?"Marcar dentro de jornada":"Marcar como extra (pagada)"}</button>}
                      <button style={Object.assign({},S.aMSt,{background:st==="nocoverage"?"#fff7ed":"#f8fafc",borderColor:st==="nocoverage"?"#fdba74":"#e2e8f0",color:st==="nocoverage"?"#9a3412":"#475569"})} onClick={function(){p.sst(s,slot,it.key,"nocoverage");setSm(false);}}>
                        {st==="nocoverage"?"Quitar sin cobertura":"Sin cobertura"}
                      </button>
                      <button style={Object.assign({},S.aMSt,{background:st==="suspended"?"#fef2f2":"#f8fafc",borderColor:st==="suspended"?"#fca5a5":"#e2e8f0",color:st==="suspended"?"#991b1b":"#475569"})} onClick={function(){p.sst(s,slot,it.key,"suspended");setSm(false);}}>
                        {st==="suspended"?"Quitar suspensión":"Suspender"}
                      </button>
                      {canMove&&<button style={Object.assign({},S.aMSt,{background:"#f0f9ff",borderColor:"#7dd3fc",color:"#0369a1"})} onClick={function(){setSm(false);p.onMove(it,s);}}>Cancelar y trasladar a otra fecha</button>}
                      {mvF&&<button style={Object.assign({},S.aMSt,{background:"#f0f9ff",borderColor:"#7dd3fc",color:"#0369a1"})} onClick={function(){setSm(false);p.editMove(mvF);}}>Editar traslado</button>}
                      {mvF&&<button style={Object.assign({},S.aMSt,{background:"#fef2f2",borderColor:"#fca5a5",color:"#991b1b"})} onClick={function(){p.rmMove(mvF.id);setSm(false);}}>Deshacer traslado</button>}
                      {it.extra&&<button style={Object.assign({},S.aMSt,{background:"#fef2f2",borderColor:"#fca5a5",color:"#991b1b"})} onClick={function(){setSm(false);ask("¿Quitar "+lblTxt+" de este día?",function(){p.rmExtra(s,slot,it.key);},"Quitar");}}>Quitar esta actividad del día</button>}
                    </div>
                  )}
                  <button style={S.aMClose} onClick={function(){setSm(false);}}>Cerrar</button>
                </div>
              )}
            </div>
          );
        }

        // Añadir consulta (nombre libre que empieza por C) o tarde/mañana de endoscopia en un día concreto
        function AddActModal({ctx,keys,gAbs,onSave,onClose}){
          var date=pl(ctx.s);
          var [slot,setSlot]=useState(ctx.slot);
          var [kind,setKind]=useState("con");
          var [name,setName]=useState("C");
          var [doc,setDoc]=useState("");
          var [pay,setPay]=useState("jornada");
          var [err,setErr]=useState("");
          var key=kind==="con"?normC(name):kind;
          var dup=key&&keys&&keys[slot]&&keys[slot].includes(key);
          var endoPm=kind==="con"||((kind==="E47"||kind==="E46")&&slot==="pm");
          function save(){
            if(kind==="con"&&(!key||key==="C")){setErr("Escribe el nombre de la consulta (por ejemplo C44 o C-HEP).");return;}
            if(dup){setErr(key+" ya existe en el turno de "+(slot==="am"?"mañana":"tarde")+" de este día.");return;}
            onSave(slot,kind==="con"?key:kind,key,doc||null,endoPm?pay:null);
          }
          var docOpts=docsOn(ctx.s).map(function(d){var ab=gAbs(d,date,slot);return <option key={d} value={d} disabled={!!ab}>{d}{ab?(ab.k==="free"?" (día libre)":" (ausente)"):""}</option>;});
          return (
            <div style={S.overlay}>
              <div style={S.modal}>
                <h3 style={{fontSize:18,fontWeight:700,margin:"0 0 4px",color:"#0f172a"}}>Añadir actividad</h3>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 16px"}}>{DN[(date.getDay()+6)%7]} {fmtS(ctx.s)} · solo para este día. Para que se repita cada semana, añádela en Semana tipo.</p>
                <div style={{marginBottom:14}}>
                  <label style={S.lbl}>Turno</label>
                  <div style={{display:"flex",gap:6}}>
                    <LChip on={slot==="am"} onClick={function(){setSlot("am");setErr("");}}>Mañana</LChip>
                    <LChip on={slot==="pm"} onClick={function(){setSlot("pm");setErr("");}}>Tarde</LChip>
                  </div>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={S.lbl}>Tipo</label>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <LChip on={kind==="con"} onClick={function(){setKind("con");setErr("");}}>Consulta</LChip>
                    <LChip on={kind==="E47"} onClick={function(){setKind("E47");setErr("");}}>Endoscopia E47</LChip>
                    <LChip on={kind==="E46"} onClick={function(){setKind("E46");setErr("");}}>Endoscopia E46</LChip>
                    <LChip on={kind==="HDD"} onClick={function(){setKind("HDD");setErr("");}}>Hospital de día</LChip>
                  </div>
                </div>
                {kind==="con"&&(
                  <div style={{marginBottom:14}}>
                    <label style={S.lbl}>Nombre de la consulta</label>
                    <input type="text" style={S.inp} value={name} placeholder="C44" onChange={function(e){setName(normC(e.target.value)||"C");setErr("");}}/>
                    <div style={{fontSize:11,color:"#64748b",marginTop:4}}>Siempre empieza por C. Se guardará como <b>{key||"C"}</b>.</div>
                  </div>
                )}
                {endoPm&&(
                  <div style={{marginBottom:14}}>
                    <label style={S.lbl}>Modalidad</label>
                    <div style={{display:"flex",gap:6}}>
                      <LChip on={pay==="jornada"} onClick={function(){setPay("jornada");}}>Dentro de jornada</LChip>
                      <LChip on={pay==="extra"} onClick={function(){setPay("extra");}}>Extra (pagada)</LChip>
                    </div>
                  </div>
                )}
                <div style={{marginBottom:16}}>
                  <label style={S.lbl}>Médico (opcional)</label>
                  <select style={S.sel} value={doc} onChange={function(e){setDoc(e.target.value);}}><option value="">Sin designar</option>{docOpts}</select>
                </div>
                {(err||dup)&&<div style={S.err}>{err||(key+" ya existe en este turno.")}</div>}
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button style={S.btnS} onClick={onClose}>Cancelar</button>
                  <button style={S.btnP} onClick={save}>Añadir</button>
                </div>
              </div>
            </div>
          );
        }

        // Cancelar una agenda de consulta u HDD y trasladarla a otra fecha
        function MoveModal({ctx,gAbs,ife,onSave,onClose}){
          var it=ctx.it,ed=ctx.edit;
          var [toDate,setToDate]=useState(ed?ed.toDate:"");
          var [toSlot,setToSlot]=useState(ed?ed.toSlot:it.slot);
          var [doc,setDoc]=useState(ed?(ed.doctor||""):(it.rawDoc||""));
          var [reason,setReason]=useState(ed?(ed.reason||""):"");
          var [err,setErr]=useState("");
          var warn="";
          if(toDate){
            var td=pl(toDate),wd=td.getDay();
            if(wd===0||wd===6)warn="Es fin de semana.";
            else if(ife(td))warn="Es festivo.";
            else if(doc){var ab=gAbs(doc,td,toSlot);if(ab)warn=doc+(ab.k==="free"?" tiene día libre ese día.":" está ausente ese día.");}
          }
          function save(){
            if(!toDate){setErr("Elige la nueva fecha.");return;}
            if(toDate===ctx.s&&toSlot===it.slot){setErr("La nueva fecha y turno coinciden con los actuales.");return;}
            var wd=pl(toDate).getDay();
            if(wd===0||wd===6){setErr("No se puede trasladar a fin de semana.");return;}
            if(ed){onSave(Object.assign({},ed,{toDate:toDate,toSlot:toSlot,doctor:doc||null,reason:reason,edited:ld(new Date())}),true);return;}
            onSave({id:""+Date.now(),key:it.key,act:it.act,label:it.label||it.act,cat:it.cat,pay:it.payable?it.pay:undefined,fromDate:ctx.s,fromSlot:it.slot,toDate:toDate,toSlot:toSlot,doctor:doc||null,origDoc:it.rawDoc||null,reason:reason,created:ld(new Date())});
          }
          return (
            <div style={S.overlay}>
              <div style={S.modal}>
                <h3 style={{fontSize:18,fontWeight:700,margin:"0 0 4px",color:"#0f172a"}}>{ed?"Editar traslado":"Trasladar agenda"}</h3>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 16px"}}>{it.label||it.act} · {CATL[it.cat]} · {fmtS(ctx.s)} {it.slot==="am"?"mañana":"tarde"}. Quedará anulada en esta fecha y aparecerá en la nueva.</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                  <div><label style={S.lbl}>Nueva fecha</label><input type="date" style={S.inp} value={toDate} onChange={function(e){setToDate(e.target.value);setErr("");}}/></div>
                  <div><label style={S.lbl}>Turno</label><select style={S.sel} value={toSlot} onChange={function(e){setToSlot(e.target.value);}}><option value="am">Mañana</option><option value="pm">Tarde</option></select></div>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={S.lbl}>Médico</label>
                  <select style={S.sel} value={doc} onChange={function(e){setDoc(e.target.value);}}><option value="">Sin designar</option>{docsOn(toDate||ctx.s).map(function(d){return <option key={d} value={d}>{d}</option>;})}</select>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={S.lbl}>Motivo (opcional)</label>
                  <input type="text" style={S.inp} value={reason} placeholder="Ej: congreso, obras en la sala..." onChange={function(e){setReason(e.target.value);}}/>
                </div>
                {warn&&<div style={Object.assign({},S.err,{background:"#fffbeb",color:"#92400e",borderColor:"#fcd34d"})}>Atención: {warn}</div>}
                {err&&<div style={S.err}>{err}</div>}
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button style={S.btnS} onClick={onClose}>Cancelar</button>
                  <button style={S.btnP} onClick={save}>{ed?"Guardar cambios":"Trasladar"}</button>
                </div>
              </div>
            </div>
          );
        }

        function CatChips({v,setV}){
          return <>{CATF.map(function(x){return <LChip key={x[0]} on={v===x[0]} onClick={function(){setV(x[0]);}}>{x[1]}</LChip>;})}</>;
        }
        function SlotTagA({sh}){

        // Actividad pagada como extra: listado, resumen por médico y exportación
        function ExtView({ga,gst,ife,onExp}){
          var thisY=new Date().getFullYear();
          var [yr,setYr]=useState(thisY);
          var [fMo,setFMo]=useState("all");
          var [fDoc,setFDoc]=useState("all");
          var [fc,setFc]=useState("all");
          var [fSt,setFSt]=useState("done");
          var all=useMemo(function(){
            var out=[];
            for(var d=new Date(yr,0,1,12);d.getFullYear()===yr;d.setDate(d.getDate()+1)){
              var wd=d.getDay();if(wd===0||wd===6||ife(d))continue;
              var s=ld(d),ag=ga(dkOf(d),new Date(d));
              ["am","pm"].forEach(function(sl){ag[sl].forEach(function(it){
                if(!it.payable||it.pay!=="extra"||it.movedTo)return;
                var st=gst(s,sl,it.key);
                var docSt=!it.rawDoc?"none":it.doc==="__LEAVE__"?"ausente":it.doc==="__FREE__"?"día libre":it.doc==="__OFF__"?"no activo":"ok";
                var estado=st==="suspended"?"Suspendida":st==="nocoverage"?"Sin cobertura":docSt==="none"?"Sin designar":docSt!=="ok"?"Médico "+docSt:"Realizada / prevista";
                out.push({date:s,day:DN[(wd+6)%7],slot:sl,label:it.label||it.act,cat:it.cat,doc:it.rawDoc||"",done:!st&&docSt==="ok",estado:estado,moved:!!it.movedFrom});
              });});
            }
            return out;
          },[ga,gst,ife,yr]);
          var fil=all.filter(function(r){
            if(fMo!=="all"&&r.date.slice(5,7)!==fMo)return false;
            if(fDoc!=="all"&&r.doc!==fDoc)return false;
            if(!catMatch(r.cat,fc))return false;
            if(fSt==="done"&&!r.done)return false;
            if(fSt==="not"&&r.done)return false;
            return true;
          });
          // Resumen por médico (solo realizadas / previstas, con los filtros de mes y tipo)
          var base=all.filter(function(r){return r.done&&(fMo==="all"||r.date.slice(5,7)===fMo)&&catMatch(r.cat,fc);});
          var docsIn=docsAll().filter(function(d){return base.some(function(r){return r.doc===d;});});
          var sumRows=docsIn.map(function(d){
            var e=base.filter(function(r){return r.doc===d&&r.cat==="endo";}).length,c=base.filter(function(r){return r.doc===d&&r.cat==="con";}).length;

                <div style={Object.assign({},S.td,{textAlign:"center"})}>{e}</div>
                <div style={Object.assign({},S.td,{textAlign:"center"})}>{c}</div>
                <div style={Object.assign({},S.td,{textAlign:"center",fontWeight:800})}>{e+c}</div>
              </div>
            );
          });
          var cols="105px 90px 85px 1fr 120px 70px 150px";
          var rows=fil.map(function(r,i){
            var dc=DR[r.doc];
            return (
              <div key={r.date+r.slot+r.label+i} style={{display:"grid",gridTemplateColumns:cols,borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa",fontSize:13,alignItems:"center"}}>
                <div style={S.td}>{fmtS(r.date)}</div>
                <div style={S.td}>{r.day}</div>
                <div style={S.td}><SlotTag slot={r.slot}/></div>
                <div style={Object.assign({},S.td,{fontWeight:600})}>{r.label}{r.moved&&<span style={{fontSize:10,color:"#0369a1",marginLeft:6}}>(trasladada)</span>}</div>
                <div style={S.td}>{CATL[r.cat]}</div>
                <div style={S.td}>{dc?<span style={{fontWeight:700,color:dc.color,background:dc.bg,padding:"1px 8px",borderRadius:8}}>{r.doc}</span>:"—"}</div>
                <div style={Object.assign({},S.td,{fontSize:12,color:r.done?"#166534":"#9a3412"})}>{r.estado}</div>
              </div>
            );
          });
          var selSt=Object.assign({},S.sel,{width:"auto",padding:"5px 10px",fontSize:12});
          var years=[thisY-1,thisY,thisY+1];
          var tot=base.length;
          return (
            <div style={{padding:24,maxWidth:1000,margin:"0 auto"}}>

                <h2 style={Object.assign({},S.h2,{margin:0})}>Actividad pagada como extra</h2>
                <button style={S.addBtn} onClick={function(){onExp(fil,yr);}}>Exportar CSV</button>
              </div>
              <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px"}}>Incluye las endoscopias de tarde y las consultas marcadas como "Extra (pagada)", ya sea en la Semana tipo o en un día concreto. Las suspendidas, sin cobertura o sin médico disponible se pueden ver, pero no suman en el resumen.</p>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:12,marginBottom:14,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                <select style={selSt} value={yr} onChange={function(e){setYr(+e.target.value);}}>{years.map(function(y){return <option key={y} value={y}>{y}</option>;})}</select>
                <select style={selSt} value={fMo} onChange={function(e){setFMo(e.target.value);}}><option value="all">Todo el año</option>{MES.map(function(m,i){return <option key={m} value={p2(i+1)}>{m}</option>;})}</select>
                <select style={selSt} value={fDoc} onChange={function(e){setFDoc(e.target.value);}}><option value="all">Todos los médicos</option>{docsAll().map(function(d){return <option key={d} value={d}>{d}</option>;})}</select>
                <select style={selSt} value={fc} onChange={function(e){setFc(e.target.value);}}><option value="all">Endoscopias y consultas</option><option value="endo">Solo endoscopias</option><option value="con">Solo consultas</option></select>

              <h3 style={{fontSize:15,fontWeight:700,margin:"0 0 8px"}}>Resumen por médico · {fMo==="all"?"año "+yr:MES[+fMo-1]+" "+yr} <span style={{fontWeight:400,color:"#64748b",fontSize:13}}>({tot} en total)</span></h3>
              {sumRows.length===0?<div style={{fontSize:13,color:"#94a3b8",marginBottom:18}}>No hay actividad extra en este periodo.</div>:(
                <div style={Object.assign({},S.tbl,{marginBottom:20,maxWidth:560})}>
                  <div style={Object.assign({},S.th,{gridTemplateColumns:"90px 1fr 1fr 1fr"})}><div style={S.thc}>Médico</div><div style={Object.assign({},S.thc,{textAlign:"center"})}>Endoscopias</div><div style={Object.assign({},S.thc,{textAlign:"center"})}>Consultas</div><div style={Object.assign({},S.thc,{textAlign:"center"})}>Total</div></div>
                  {sumRows}

              <h3 style={{fontSize:15,fontWeight:700,margin:"0 0 8px"}}>Detalle</h3>
              {fil.length===0?<div style={{textAlign:"center",padding:32,color:"#94a3b8"}}>Sin actividad extra con estos filtros</div>:(
                <div style={Object.assign({},S.tbl,{overflowX:"auto"})}>
                  <div style={{minWidth:760}}>
                    <div style={Object.assign({},S.th,{gridTemplateColumns:cols})}><div style={S.thc}>Fecha</div><div style={S.thc}>Día</div><div style={S.thc}>Turno</div><div style={S.thc}>Actividad</div><div style={S.thc}>Tipo</div><div style={S.thc}>Médico</div><div style={S.thc}>Estado</div></div>
                    {rows}
                  </div>
                </div>
              )}
            </div>
          );
        }
