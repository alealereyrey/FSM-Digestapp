          }
          var weeks=vm==="month"?mwk:[wds[0]];
          var wrows=weeks.map(function(m,wi){
            var wD=vm==="month"?wkDates(m):wds;
            var comp=vm==="month";
            var dcols=wD.map(function(date,idx){
              var s=ld(date),fesd=ife(date),abs=getAbs(date),isT=ld(new Date())===s;
              var abItems=abs.map(function(a){
                var d=DR[a.doc];
                return (
                  <div key={a.doc+a.id} style={{display:"flex",alignItems:"center",gap:4,background:a.k==="free"?"#fff":d.bg,border:"1px "+(a.k==="free"?"dashed ":"solid ")+d.color+"88",borderRadius:6,padding:comp?"2px 5px":"4px 8px"}}>
                    <span style={{fontWeight:800,fontSize:comp?11:13,color:d.color}}>{a.doc}</span>
                    {!comp&&<span style={{fontSize:12,color:"#475569",flex:1}}>{a.label}</span>}
                    {shTag(a.shift,comp)}
                    <span style={{fontSize:comp?9:10,color:"#94a3b8",background:"#fff",padding:"0 4px",borderRadius:4,marginLeft:comp?"auto":0}}>{a.type}</span>
                  </div>
                );
              });
              return (
                <div key={s} style={Object.assign({},S.dCol,comp?S.dColC:{},isT?{border:"2px solid #3b82f6"}:{},{minHeight:comp?60:120})}>
                  <DHdr date={date} dk={DK[idx]} compact={comp}/>
                  {fesd&&<div style={S.fesB}><span style={S.fesL}>{comp?"FES":"FESTIVO"}</span></div>}
                  {!fesd&&abs.length===0&&<div style={{padding:comp?"4px 6px":"8px 10px",color:"#94a3b8",fontSize:comp?10:12,textAlign:"center"}}>{comp?"OK":"Sin ausencias"}</div>}
                  {!fesd&&abs.length>0&&<div style={{padding:comp?"3px 4px":"6px 8px",display:"flex",flexDirection:"column",gap:comp?2:4}}>{abItems}</div>}
                </div>
              );
            });
            return (
              <div key={wi} style={comp?S.mRow:Object.assign({},S.dGrid,{marginBottom:8})}>
                {comp&&<div style={{display:"flex",alignItems:"center",justifyContent:"center"}}><span style={S.mWN}>S{wi+1}</span></div>}
                {dcols}
              </div>
            );
          });
          return (
            <div style={S.dash}>
              <div style={{maxWidth:1000,margin:"0 auto"}}>{modBtns}</div>
              <div ref={dashRef} style={S.capW}>
                {vm==="month"&&<div style={Object.assign({},S.mRow,{marginBottom:4})}><div/>{DN.map(function(d){return <div key={d} style={S.mDL}>{d}</div>;})}</div>}
                {wrows}
              </div>
            </div>
          );
        }

        function LView({lvs,setLvs,fes,onAdd,onEdit}){
          var today=ld(new Date()),thisY=new Date().getFullYear();
          var [fSt,setFSt]=useState("all");
          var [fDoc,setFDoc]=useState("all");
          var [fType,setFType]=useState("all");
          var [fYear,setFYear]=useState("all");
          var [fMon,setFMon]=useState("all");
          var [rest,setRest]=useState(false);
          var [sumY,setSumY]=useState(thisY);
          var [cancelTarget,setCancelTarget]=useState(null);
          var [cancelReason,setCancelReason]=useState("");

          var years=[...new Set(lvs.reduce(function(a,l){if(l.startDate)a.push(+l.startDate.slice(0,4));if(l.endDate)a.push(+l.endDate.slice(0,4));return a;},[thisY]))].sort();

          // Resumen anual: solo ausencias NO anuladas, solo días hábiles (sin festivos ni fines de semana) del año elegido
          var sum={};
          docsAll().forEach(function(doc){sum[doc]={};LT.forEach(function(lt){sum[doc][lt.c]=0;});});
          lvs.filter(function(l){return!l.cancelled;}).forEach(function(l){
            if(sum[l.doctor])sum[l.doctor][l.type]=(sum[l.doctor][l.type]||0)+lvDays(l,fes,sumY);
          });

          function overlaps(l,a,b){return l.startDate<=b&&l.endDate>=a;}
          var filtered=lvs.filter(function(l){
            if(fSt==="active"&&l.cancelled)return false;
            if(fSt==="cancelled"&&!l.cancelled)return false;
            if(fDoc!=="all"&&l.doctor!==fDoc)return false;
            if(fType!=="all"&&l.type!==fType)return false;
            if(rest){if(!overlaps(l,today,thisY+"-12-31"))return false;}
            else{
              if(fYear!=="all"&&fMon!=="all"){var a=fYear+"-"+fMon,last=new Date(+fYear,+fMon,0).getDate();if(!overlaps(l,a+"-01",a+"-"+p2(last)))return false;}
              else if(fYear!=="all"){if(!overlaps(l,fYear+"-01-01",fYear+"-12-31"))return false;}
              else if(fMon!=="all"){if(!(l.startDate.slice(5,7)===fMon||l.endDate.slice(5,7)===fMon))return false;}
            }
            return true;
          }).sort(function(a,b){return(a.startDate||"").localeCompare(b.startDate||"")||(a.endDate||"").localeCompare(b.endDate||"");});

          function doCancel(){
            setLvs(function(p){return p.map(function(x){return x.id===cancelTarget?Object.assign({},x,{cancelled:true,cancelReason:cancelReason,cancelledAt:today}):x;});});
            setCancelTarget(null);setCancelReason("");
          }
          function doReactivate(id){
            setLvs(function(p){return p.map(function(x){return x.id===id?Object.assign({},x,{cancelled:false,cancelReason:"",cancelledAt:"",reactivatedAt:today}):x;});});
          }

          var cards=filtered.map(function(l){
            var lt=LT.find(function(x){return x.c===l.type;})||{l:l.type};
            var nd=lvDays(l,fes);
            return (
              <div key={l.id} style={{background:l.cancelled?"#fef2f2":"#fff",border:"1px solid "+(l.cancelled?"#fca5a5":"#e2e8f0"),borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:12,marginBottom:8,flexWrap:"wrap"}}>
                <div style={{padding:"4px 12px",borderRadius:20,fontWeight:700,fontSize:13,background:DR[l.doctor]&&DR[l.doctor].bg,color:DR[l.doctor]&&DR[l.doctor].color}}>{l.doctor}</div>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:14,fontWeight:600,color:l.cancelled?"#991b1b":"#1e293b",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",textDecoration:l.cancelled?"line-through":"none"}}>
                    {lt.l}
                    {(l.shift&&l.shift!=="all")&&<SlotTag slot={l.shift}/>}
                  </div>
                  <div style={{fontSize:12,color:"#64748b"}}>
                    {fmtS(l.startDate)} - {fmtS(l.endDate)} · {l.cancelled?"no computa":fmtN(nd)+" "+(nd===1?"día hábil":"días hábiles")}
                  </div>
                  {l.cancelled&&<div style={{fontSize:11,color:"#991b1b",marginTop:2}}><b>ANULADA</b>{l.cancelledAt?" el "+fmtS(l.cancelledAt):""}{l.cancelReason?" · Motivo: "+l.cancelReason:""}</div>}
                  {!l.cancelled&&l.reactivatedAt&&<div style={{fontSize:11,color:"#166534",marginTop:2}}>Reactivada el {fmtS(l.reactivatedAt)}</div>}
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <span style={{fontSize:10,color:"#fff",padding:"2px 8px",borderRadius:10,fontWeight:600,background:l.validated?"#22c55e":"#94a3b8"}}>Validado</span>
                  <span style={{fontSize:10,color:"#fff",padding:"2px 8px",borderRadius:10,fontWeight:600,background:l.informed?"#22c55e":"#94a3b8"}}>Informado</span>
                </div>
                <div style={{display:"flex",gap:4}}>
                  {!l.cancelled&&<button style={{background:"#fef2f2",color:"#991b1b",border:"1px solid #fca5a5",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11,fontFamily:"inherit"}} onClick={function(){setCancelTarget(l.id);setCancelReason("");}}>Anular</button>}
                  {l.cancelled&&<button style={{background:"#f0fdf4",color:"#166534",border:"1px solid #bbf7d0",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11,fontFamily:"inherit"}} onClick={function(){doReactivate(l.id);}}>Reactivar</button>}
                  <button style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:12,fontFamily:"inherit"}} onClick={function(){onEdit(l);}}>Editar</button>
                </div>
              </div>
            );
          });

          var gcols="80px repeat("+LT.length+",1fr) 60px";
          var hdrCells=["Médico"].concat(LT.map(function(x){return x.c;})).concat(["Total"]).map(function(c){return <div key={c} style={{padding:"8px 4px",textAlign:"center"}}>{c}</div>;});
          var srows=docsAll().filter(function(doc){var d=DOCS.find(function(x){return x.code===doc;});return(!d.on||d.on<=sumY+"-12-31")&&(!d.off||d.off>sumY+"-01-01");}).map(function(doc){
            var tot=0;
            var cells=LT.map(function(lt){var v=sum[doc][lt.c]||0;tot+=v;return <div key={lt.c} style={{padding:"8px 4px",textAlign:"center",fontSize:13,color:v>0?"#ef4444":"#94a3b8",fontWeight:v>0?700:400}}>{fmtN(v)}</div>;});
            return (
              <div key={doc} style={{display:"grid",gridTemplateColumns:gcols,borderBottom:"1px solid #f1f5f9"}}>
                <div style={{padding:"8px",fontWeight:700,color:DR[doc].color,textAlign:"center"}}>{doc}</div>
                {cells}
                <div style={{padding:"8px 4px",textAlign:"center",fontSize:13,fontWeight:800,color:"#0f172a"}}>{fmtN(tot)}</div>
              </div>
            );
          });
          var selSt=Object.assign({},S.sel,{width:"auto",padding:"5px 10px",fontSize:12});

          return (
            <div style={{padding:24,maxWidth:980,margin:"0 auto"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <h2 style={Object.assign({},S.h2,{margin:0})}>Gestión de ausencias</h2>
                <button style={S.addBtn} onClick={onAdd}>+ Nueva</button>
              </div>
              <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:12,marginBottom:14,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  {[["all","Todas"],["active","Activas"],["cancelled","Anuladas"]].map(function(x){return <LChip key={x[0]} on={fSt===x[0]} onClick={function(){setFSt(x[0]);}}>{x[1]}</LChip>;})}
                  <span style={{width:1,height:20,background:"#e2e8f0",margin:"0 4px"}}/>
                  <LChip on={rest} onClick={function(){setRest(!rest);}}>Lo que resta del año</LChip>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                  <select style={selSt} value={fDoc} onChange={function(e){setFDoc(e.target.value);}}><option value="all">Todos los médicos</option>{docsAll().map(function(d){return <option key={d} value={d}>{d}</option>;})}</select>
                  <select style={selSt} value={fType} onChange={function(e){setFType(e.target.value);}}><option value="all">Todos los tipos</option>{LT.map(function(t){return <option key={t.c} value={t.c}>{t.l}</option>;})}</select>
                  <select style={Object.assign({},selSt,rest?{opacity:0.4}:{})} disabled={rest} value={fYear} onChange={function(e){setFYear(e.target.value);}}><option value="all">Todos los años</option>{years.map(function(y){return <option key={y} value={String(y)}>{y}</option>;})}</select>
                  <select style={Object.assign({},selSt,rest?{opacity:0.4}:{})} disabled={rest} value={fMon} onChange={function(e){setFMon(e.target.value);}}><option value="all">Todos los meses</option>{MES.map(function(m,i){return <option key={m} value={p2(i+1)}>{m}</option>;})}</select>
                  <span style={{fontSize:12,color:"#64748b",marginLeft:"auto"}}>{filtered.length} {filtered.length===1?"ausencia":"ausencias"}</span>
                </div>
              </div>
              {filtered.length===0&&<div style={{textAlign:"center",color:"#94a3b8",padding:24}}>No hay ausencias con estos filtros</div>}
              {cards}
              <div style={{display:"flex",alignItems:"center",gap:10,marginTop:32,marginBottom:4}}>
                <h3 style={{fontSize:16,fontWeight:700,color:"#0f172a",margin:0}}>Resumen anual</h3>
                <select style={selSt} value={sumY} onChange={function(e){setSumY(+e.target.value);}}>{years.map(function(y){return <option key={y} value={y}>{y}</option>;})}</select>
              </div>
              <p style={{fontSize:12,color:"#64748b",marginBottom:12}}>Días hábiles. No cuentan las ausencias anuladas, los festivos ni los fines de semana. Una ausencia de solo mañana o solo tarde cuenta como 1 día.</p>
              <div style={{background:"#fff",borderRadius:10,overflowX:"auto",border:"1px solid #e2e8f0"}}>
                <div style={{minWidth:720}}>
                  <div style={{display:"grid",gridTemplateColumns:gcols,background:"#0f172a",color:"#94a3b8",fontSize:11,fontWeight:700}}>{hdrCells}</div>
                  {srows}
                </div>
              </div>
              <div style={{fontSize:11,color:"#64748b",marginTop:8,display:"flex",flexWrap:"wrap",gap:"4px 14px"}}>{LT.map(function(t){return <span key={t.c}><b>{t.c}</b> {t.l}</span>;})}</div>

              {cancelTarget&&(
                <div style={S.overlay}>
                  <div style={S.modal}>
                    <h3 style={{fontSize:16,fontWeight:700,margin:"0 0 12px",color:"#991b1b"}}>Anular ausencia</h3>
                    <p style={{fontSize:13,color:"#475569",marginBottom:16}}>El médico quedará disponible en el dashboard esos días. La ausencia seguirá registrada aquí como anulada y no computará en el resumen.</p>
                    <div style={{marginBottom:16}}>
                      <label style={S.lbl}>Motivo de anulación (opcional)</label>
                      <input type="text" style={S.inp} placeholder="Ej: cambio de planes, error de registro..." value={cancelReason} onChange={function(e){setCancelReason(e.target.value);}}/>
                    </div>
                    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                      <button style={S.btnS} onClick={function(){setCancelTarget(null);setCancelReason("");}}>Cancelar</button>
                      <button style={Object.assign({},S.btnP,{background:"#ef4444"})} onClick={doCancel}>Confirmar anulación</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function LModal({lv,fes,onSave,onDel,onClose}){
          var [form,setForm]=useState(lv||{doctor:"RGS",type:"VAC",shift:"all",startDate:"",endDate:"",validated:false,informed:false});
          var [err,setErr]=useState("");
          function set(k,v){setForm(function(p){var n=Object.assign({},p,{[k]:v});if(k==="startDate"&&(!p.endDate||p.endDate<v))n.endDate=v;return n;});setErr("");}
          var docOpts=docsCurrent(form.doctor).map(function(d){return <option key={d} value={d}>{d}</option>;});
          var typeOpts=LT.map(function(lt){return <option key={lt.c} value={lt.c}>{lt.l} ({lt.c})</option>;});
          var nd=lvDays(form,fes);
          function save(){
            if(!form.startDate||!form.endDate){setErr("Indica las fechas de inicio y fin.");return;}
            if(form.endDate<form.startDate){setErr("La fecha de fin es anterior a la de inicio.");return;}
            onSave(form);
          }
          return (
            <div style={S.overlay}>
              <div style={S.modal}>
                <h3 style={{fontSize:18,fontWeight:700,margin:"0 0 20px",color:"#0f172a"}}>{lv?"Editar":"Nueva"} ausencia</h3>
                <div style={{marginBottom:14}}><label style={S.lbl}>Médico</label><select style={S.sel} value={form.doctor} onChange={function(e){set("doctor",e.target.value);}}>{docOpts}</select></div>
                <div style={{marginBottom:14}}><label style={S.lbl}>Tipo</label><select style={S.sel} value={form.type} onChange={function(e){set("type",e.target.value);}}>{typeOpts}</select></div>
                <div style={{marginBottom:14}}>
                  <label style={S.lbl}>Duración</label>
                  <div style={{display:"flex",gap:6}}>
                    {["all","am","pm"].map(function(x){return <LChip key={x} on={(form.shift||"all")===x} onClick={function(){set("shift",x);}}>{x==="all"?"Todo el día":"Solo "+SHL[x].toLowerCase()}</LChip>;})}
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:8}}>
                  <div><label style={S.lbl}>Inicio</label><input type="date" style={S.inp} value={form.startDate} onChange={function(e){set("startDate",e.target.value);}}/></div>
                  <div><label style={S.lbl}>Fin</label><input type="date" style={S.inp} value={form.endDate} min={form.startDate||undefined} onChange={function(e){set("endDate",e.target.value);}}/></div>
                </div>
                {form.startDate&&form.endDate&&form.endDate>=form.startDate&&<div style={{fontSize:12,color:"#475569",marginBottom:14}}>Computa <b>{fmtN(nd)}</b> {nd===1?"día hábil":"días hábiles"} (sin festivos ni fines de semana).</div>}
                <div style={{display:"flex",gap:16,marginBottom:16}}>
                  <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"#475569",cursor:"pointer"}}><input type="checkbox" checked={!!form.validated} onChange={function(e){set("validated",e.target.checked);}}/> Validado</label>
                  <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"#475569",cursor:"pointer"}}><input type="checkbox" checked={!!form.informed} onChange={function(e){set("informed",e.target.checked);}}/> Informado</label>
                </div>
                {err&&<div style={S.err}>{err}</div>}
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  {lv&&<button style={S.btnD} onClick={function(){onDel(lv.id);}}>Eliminar</button>}
                  <button style={S.btnS} onClick={onClose}>Cancelar</button>
                  <button style={S.btnP} onClick={save}>Guardar</button>
                </div>
              </div>
            </div>
          );
        }

        // Plantilla de médicos: altas y bajas a partir de una fecha
        function DocModal({docs,setDocs,onClose}){
          var today=ld(new Date());
          var used=docs.map(function(d){return d.color;});
          var freePal=PAL.find(function(c){return!used.includes(c.color);})||PAL[0];
          var [nf,setNf]=useState({code:"",name:"",on:"",color:freePal.color,bg:freePal.bg});
          var [edit,setEdit]=useState(null);
          var [ef,setEf]=useState(null);
          var [err,setErr]=useState("");
          function addDoc(){
            var c=(nf.code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
            if(c.length<2||c.length>5){setErr("El código debe tener entre 2 y 5 letras (por ejemplo LGM).");return;}
            if(docs.some(function(d){return d.code===c;})){setErr("Ya existe un médico con el código "+c+".");return;}
            setDocs(function(p){return p.concat([{code:c,name:nf.name.trim(),color:nf.color,bg:nf.bg,on:nf.on||"",off:""}]);});
            var nx=PAL.find(function(x){return x.color!==nf.color&&!used.includes(x.color);})||PAL[0];
            setNf({code:"",name:"",on:"",color:nx.color,bg:nx.bg});setErr("");
          }
          function startEdit(d){setEdit(d.code);setEf(Object.assign({},d));setErr("");}
          function saveEdit(){
            if(ef.on&&ef.off&&ef.off<=ef.on){setErr("La fecha de baja tiene que ser posterior a la de alta.");return;}
            setDocs(function(p){return p.map(function(x){return x.code===edit?ef:x;});});
            setEdit(null);setEf(null);setErr("");
          }
          function status(d){
            if(d.off&&d.off<=today)return{t:"Baja desde "+fmtS(d.off),c:"#991b1b",b:"#fef2f2"};
            if(d.on&&d.on>today)return{t:"Alta el "+fmtS(d.on),c:"#0369a1",b:"#e0f2fe"};
            if(d.off)return{t:"Activo · baja el "+fmtS(d.off),c:"#92400e",b:"#fef3c7"};
            return{t:"Activo",c:"#166534",b:"#dcfce7"};
          }
          function swatches(cur,onPick){
            return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{PAL.map(function(c){return <button key={c.color} title={c.color} onClick={function(){onPick(c);}} style={{width:22,height:22,borderRadius:"50%",background:c.bg,border:"3px solid "+(cur===c.color?c.color:c.bg),outline:cur===c.color?"2px solid #0f172a":"none",cursor:"pointer"}}/>;})}</div>;
          }
          var rows=docs.map(function(d){
            var st=status(d);
            if(edit===d.code&&ef)return (
              <div key={d.code} style={{border:"1px solid #93c5fd",background:"#f8fbff",borderRadius:8,padding:10,margin:"6px 0",display:"flex",flexDirection:"column",gap:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:800,color:ef.color,background:ef.bg,padding:"2px 10px",borderRadius:8}}>{d.code}</span><input type="text" style={S.inp} placeholder="Nombre (opcional)" value={ef.name||""} onChange={function(e){setEf(Object.assign({},ef,{name:e.target.value}));}}/></div>
                {swatches(ef.color,function(c){setEf(Object.assign({},ef,{color:c.color,bg:c.bg}));})}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div><label style={S.lbl}>Activo desde</label><input type="date" style={S.inp} value={ef.on||""} onChange={function(e){setEf(Object.assign({},ef,{on:e.target.value}));}}/></div>
                  <div><label style={S.lbl}>Baja a partir de</label><input type="date" style={S.inp} value={ef.off||""} onChange={function(e){setEf(Object.assign({},ef,{off:e.target.value}));}}/></div>
                </div>
                <div style={{fontSize:11,color:"#64748b"}}>Deja "Baja a partir de" vacío si sigue en el servicio. Desde esa fecha no se le podrá asignar actividad; su historial se conserva.</div>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><button style={Object.assign({},S.btnS,{padding:"4px 12px"})} onClick={function(){setEdit(null);setErr("");}}>Cancelar</button><button style={Object.assign({},S.btnP,{padding:"4px 12px"})} onClick={saveEdit}>Guardar</button></div>
              </div>
            );
            return (
              <div key={d.code} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f1f5f9",fontSize:13,opacity:d.off&&d.off<=today?0.6:1}}>
                <span style={{fontWeight:800,color:d.color,background:d.bg,padding:"2px 10px",borderRadius:8,minWidth:52,textAlign:"center"}}>{d.code}</span>
                <span style={{flex:1,color:"#475569"}}>{d.name||""}{d.on?<span style={{fontSize:11,color:"#94a3b8"}}>{d.name?" · ":""}alta {fmtS(d.on)}</span>:null}</span>
                <span style={{fontSize:11,fontWeight:700,color:st.c,background:st.b,padding:"1px 8px",borderRadius:8}}>{st.t}</span>
                <button style={Object.assign({},S.btnS,{padding:"3px 10px",fontSize:12})} onClick={function(){startEdit(d);}}>Editar</button>
              </div>
            );
          });
          return (
            <div style={S.overlay}>
              <div style={Object.assign({},S.modal,{maxWidth:560})}>
                <h3 style={{fontSize:18,fontWeight:700,margin:"0 0 4px",color:"#0f172a"}}>Médicos del servicio</h3>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 12px"}}>Para quitar a un médico, edítalo y pon la fecha de baja. Si en la semana tipo tenía actividades asignadas, aparecerán como "no activo" y saltará una alerta hasta que las reasignes en Semana tipo.</p>
                <div style={{maxHeight:260,overflowY:"auto",borderTop:"1px solid #e2e8f0",marginBottom:14}}>{rows}</div>
                <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:12}}>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:8}}>Añadir médico</div>
                  <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:10,marginBottom:8}}>
                    <div><label style={S.lbl}>Código</label><input type="text" style={S.inp} maxLength={5} placeholder="LGM" value={nf.code} onChange={function(e){setNf(Object.assign({},nf,{code:e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"")}));setErr("");}}/></div>
                    <div><label style={S.lbl}>Nombre (opcional)</label><input type="text" style={S.inp} value={nf.name} onChange={function(e){setNf(Object.assign({},nf,{name:e.target.value}));}}/></div>
                  </div>
                  <div style={{marginBottom:8}}><label style={S.lbl}>Color</label>{swatches(nf.color,function(c){setNf(Object.assign({},nf,{color:c.color,bg:c.bg}));})}</div>
                  <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
                    <div style={{flex:1}}><label style={S.lbl}>Activo a partir de (vacío = ya activo)</label><input type="date" style={S.inp} value={nf.on} onChange={function(e){setNf(Object.assign({},nf,{on:e.target.value}));}}/></div>
                    <button style={S.btnP} onClick={addDoc}>Añadir</button>
                  </div>
                </div>
                {err&&<div style={Object.assign({},S.err,{marginTop:12})}>{err}</div>}
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}><button style={S.btnS} onClick={onClose}>Cerrar</button></div>
              </div>
            </div>
          );
        }

        // Días libres fijos por médico (p. ej. todos los lunes)
        function FDModal({fds,setFds,onClose}){
          var y=new Date().getFullYear();
          var [f,setF]=useState({doctor:"RGS",weekday:"mon",shift:"all",from:ld(new Date()),to:y+"-12-31",note:""});
          var [err,setErr]=useState("");
          function set(k,v){setF(function(p){return Object.assign({},p,{[k]:v});});setErr("");}
          function add(){
            if(f.to&&f.from&&f.to<f.from){setErr("La fecha final es anterior a la inicial.");return;}
            setFds(function(p){return p.concat([Object.assign({},f,{id:""+Date.now()})]);});
          }
          var list=fds.slice().sort(function(a,b){return a.doctor.localeCompare(b.doctor)||DK.indexOf(a.weekday)-DK.indexOf(b.weekday);}).map(function(x){
            var d=DR[x.doctor];
            return (
              <div key={x.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f1f5f9",fontSize:13}}>
                <span style={{fontWeight:700,color:d.color,background:d.bg,padding:"1px 8px",borderRadius:8}}>{x.doctor}</span>
                <span>Todos los {DN[DK.indexOf(x.weekday)].toLowerCase()}</span><SlotTagA sh={x.shift}/>
                <span style={{fontSize:11,color:"#64748b"}}>{x.from?fmtS(x.from):"siempre"} → {x.to?fmtS(x.to):"sin fin"}</span>
                {x.note&&<span style={{fontSize:11,color:"#94a3b8"}}>· {x.note}</span>}
                <button style={Object.assign({},S.btnD,{padding:"2px 8px",fontSize:11,marginLeft:"auto"})} onClick={function(){ask("¿Quitar el día libre de "+x.doctor+" ("+DN[DK.indexOf(x.weekday)].toLowerCase()+")?",function(){setFds(function(p){return p.filter(function(z){return z.id!==x.id;});});},"Quitar");}}>Quitar</button>
              </div>
            );
          });
          return (
            <div style={S.overlay}>
              <div style={Object.assign({},S.modal,{maxWidth:560})}>
                <h3 style={{fontSize:18,fontWeight:700,margin:"0 0 4px",color:"#0f172a"}}>Días libres fijos</h3>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px"}}>Ese día el médico no se podrá asignar a ninguna actividad. Si ya estaba asignado, aparecerá como "libre" y saltará una alerta.</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div><label style={S.lbl}>Médico</label><select style={S.sel} value={f.doctor} onChange={function(e){set("doctor",e.target.value);}}>{docsCurrent(f.doctor).map(function(d){return <option key={d} value={d}>{d}</option>;})}</select></div>
                  <div><label style={S.lbl}>Día</label><select style={S.sel} value={f.weekday} onChange={function(e){set("weekday",e.target.value);}}>{DK.map(function(k,i){return <option key={k} value={k}>{DN[i]}</option>;})}</select></div>
                </div>
                <div style={{marginBottom:10}}>
                  <label style={S.lbl}>Duración</label>
                  <div style={{display:"flex",gap:6}}>
                    {["all","am","pm"].map(function(x){return <LChip key={x} on={f.shift===x} onClick={function(){set("shift",x);}}>{x==="all"?"Todo el día":"Solo "+SHL[x].toLowerCase()}</LChip>;})}
                  </div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:4}}>{f.shift==="all"?"No podrá tener ninguna actividad ese día.":f.shift==="am"?"Libre por la mañana: sí se le puede asignar actividad de tarde.":"Libre por la tarde: sí se le puede asignar actividad de mañana."}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div><label style={S.lbl}>Desde</label><input type="date" style={S.inp} value={f.from} onChange={function(e){set("from",e.target.value);}}/></div>
                  <div><label style={S.lbl}>Hasta</label><input type="date" style={S.inp} value={f.to} onChange={function(e){set("to",e.target.value);}}/></div>
                </div>
                <div style={{marginBottom:10}}><label style={S.lbl}>Nota (opcional)</label><input type="text" style={S.inp} value={f.note} placeholder="Ej: reducción de jornada" onChange={function(e){set("note",e.target.value);}}/></div>
                {err&&<div style={S.err}>{err}</div>}
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}><button style={S.btnP} onClick={add}>Añadir día libre</button></div>
                <div style={{maxHeight:220,overflowY:"auto",borderTop:"1px solid #e2e8f0"}}>
                  {list}
                  {fds.length===0&&<div style={{textAlign:"center",color:"#94a3b8",padding:16}}>Sin días libres configurados</div>}
                </div>
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}><button style={S.btnS} onClick={onClose}>Cerrar</button></div>
              </div>
            </div>
          );
        }

        // Semana tipo: estructura habitual del equipo, con versiones que se aplican desde una fecha
        function TplView({tps,setTps,fds,abActive,abOff}){
          var today=ld(new Date());
          var activeV=tplVersion(tps,today);
          function clone(t){var c=JSON.parse(JSON.stringify(t));["A","B"].forEach(function(w){c[w]=c[w]||{};DK.forEach(function(dk){c[w][dk]=c[w][dk]||{am:[],pm:[]};c[w][dk].am=c[w][dk].am||[];c[w][dk].pm=c[w][dk].pm||[];});});return c;}
          var [draft,setDraft]=useState(function(){return clone(activeV?activeV.tpl:DEF_TPL);});
          var [srcLbl,setSrcLbl]=useState(activeV?"versión vigente desde "+fmtS(activeV.from):"estructura original");
          var [wk0,setWk]=useState("A");
          var [dirty,setDirty]=useState(false);
          var nm=mon(new Date());nm.setDate(nm.getDate()+7);
          var [from,setFrom]=useState(ld(nm));
          var abOn=abActive(from||ld(new Date())); // A/B según la fecha desde la que se aplica
          var wk=abOn?wk0:"A";
          var [addSel,setAddSel]=useState({});
          var [msg,setMsg]=useState(null);

          function mut(fn){setDraft(function(p){var n=clone(p);fn(n);return n;});setDirty(true);setMsg(null);}
          function upd(dk,sl,i,patch){mut(function(n){Object.assign(n[wk][dk][sl][i],patch);});}
          function rm(dk,sl,i){mut(function(n){n[wk][dk][sl].splice(i,1);});}
          function add(dk,sl){
            var a=addSel[dk+"_"+sl]||{act:"C43",name:"C"};
            var act=a.act;
            if(act==="OTRA"){act=normC(a.name);if(!act||act==="C"){setMsg({e:1,t:"Escribe el nombre de la consulta (empieza por C)."});return;}}
            if(draft[wk][dk][sl].some(function(x){return x.key===act;})){setMsg({e:1,t:act+" ya existe en "+DN[DK.indexOf(dk)]+" "+(sl==="am"?"mañana":"tarde")+"."});return;}
            mut(function(n){var it={key:act,act:act,label:act,doc:null};if(isPmEndo(act,sl))it.pay="jornada";n[wk][dk][sl].push(it);});
          }
          function setAdd(dk,sl,patch){setAddSel(function(p){var k=dk+"_"+sl;return Object.assign({},p,{[k]:Object.assign({act:"C43",name:"C"},p[k]||{},patch)});});}
          function load(v){
            function go(){setDraft(clone(v?v.tpl:DEF_TPL));setSrcLbl(v?"versión desde "+fmtS(v.from):"estructura original");setDirty(false);setMsg(null);}
            if(dirty)ask("Hay cambios sin guardar. ¿Descartarlos?",go,"Descartar cambios");else go();
          }
          function save(){
            if(!from){setMsg({e:1,t:"Indica a partir de qué fecha se aplica."});return;}
            if(from<today){ask("La fecha es anterior a hoy: también cambiará semanas pasadas. ¿Continuar?",doSave,"Guardar igualmente");return;}
            doSave();
          }
          function doSave(){
            var v={id:""+Date.now(),from:from,tpl:clone(draft),created:today};
            setTps(function(p){return p.filter(function(x){return x.from!==from;}).concat([v]).sort(function(a,b){return a.from.localeCompare(b.from);});});
            setDirty(false);setSrcLbl("versión desde "+fmtS(from));
            setMsg({e:0,t:"Semana tipo guardada. Se aplica a partir del "+fmtS(from)+"."});
          }
          function delV(v){
            ask("¿Eliminar la versión que se aplica desde el "+fmtS(v.from)+"? Esas semanas volverán a usar la versión anterior.",function(){
              setTps(function(p){return p.filter(function(x){return x.id!==v.id;});});
            },"Eliminar versión");
          }
          function freeOn(doc,dk,sl){return fds.some(function(f){return f.doctor===doc&&f.weekday===dk&&(!f.to||f.to>=from)&&(f.shift==="all"||f.shift===sl);});}

          var addOpts=BASE_ACTS.map(function(a){return <option key={a} value={a}>{a}</option>;}).concat([<option key="OTRA" value="OTRA">Otra consulta…</option>]);
          var cols=DK.map(function(dk,di){
            var day=draft[wk][dk];
            function block(sl){
              var rows=day[sl].map(function(it,i){
                var fr=it.doc&&(freeOn(it.doc,dk,sl)||!docActive(it.doc,from));
                return (
                  <div key={it.key} style={{border:"1px solid #e2e8f0",borderRadius:7,padding:6,background:"#fff",display:"flex",flexDirection:"column",gap:4}}>
                    <div style={{display:"flex",gap:4,alignItems:"center"}}>
                      <input type="text" value={it.label||it.key} title="Nombre que se muestra" onChange={function(e){upd(dk,sl,i,{label:e.target.value});}} style={Object.assign({},S.inp,{padding:"3px 6px",fontSize:13,fontWeight:700,flex:1,minWidth:0})}/>
                      <button style={S.xBtn} title="Quitar" onClick={function(){rm(dk,sl,i);}}>✕</button>
                    </div>
                    <select value={it.doc||""} onChange={function(e){upd(dk,sl,i,{doc:e.target.value||null});}} style={Object.assign({},S.sel,{padding:"3px 6px",fontSize:12},fr?{borderColor:"#ef4444",color:"#991b1b"}:{})}>
                      <option value="">Sin designar</option>
                      {docsOn(from).concat(it.doc&&!docsOn(from).includes(it.doc)?[it.doc]:[]).map(function(d){return <option key={d} value={d}>{d}{!docActive(d,from)?" (no activo)":""}{freeOn(d,dk,sl)?" (día libre)":""}</option>;})}
                    </select>
                    {isPayable(it.act,sl)&&<select value={it.pay||"jornada"} onChange={function(e){upd(dk,sl,i,{pay:e.target.value});}} style={Object.assign({},S.sel,{padding:"3px 6px",fontSize:11})}><option value="jornada">Dentro de jornada</option><option value="extra">Extra (pagada)</option></select>}
                    {fr&&<div style={{fontSize:10,color:"#991b1b"}}>{it.doc} {docActive(it.doc,from)?"tiene día libre":"no está activo en esa fecha"}</div>}
                  </div>
                );
              });
              var a=addSel[dk+"_"+sl]||{act:"C43",name:"C"};
              return (
                <div style={sl==="am"?S.amBlk:S.pmBlk}>
                  <div style={sl==="am"?S.amLbl:S.pmLbl}>{sl==="am"?"Mañana":"Tarde"}</div>
                  <div style={{padding:6,display:"flex",flexDirection:"column",gap:5}}>
                    {rows}
                    {rows.length===0&&<div style={{fontSize:11,color:"#94a3b8",textAlign:"center"}}>Sin actividad</div>}
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",borderTop:"1px dashed #cbd5e1",paddingTop:5}}>
                      <select value={a.act} onChange={function(e){setAdd(dk,sl,{act:e.target.value});}} style={Object.assign({},S.sel,{padding:"3px 4px",fontSize:12,width:"auto",flex:1})}>{addOpts}</select>
                      {a.act==="OTRA"&&<input type="text" value={a.name} onChange={function(e){setAdd(dk,sl,{name:normC(e.target.value)||"C"});}} style={Object.assign({},S.inp,{padding:"3px 6px",fontSize:12,width:70})}/>}
                      <button style={Object.assign({},S.btnP,{padding:"3px 10px",fontSize:12})} onClick={function(){add(dk,sl);}}>+</button>
                    </div>
                  </div>
                </div>
              );
            }
            return (
              <div key={dk} style={S.dCol}>
                <div style={S.dHdr}><span style={S.dName}>{DN[di]}</span></div>
                {block("am")}
                {block("pm")}
              </div>
            );
          });

          var vers=tps.slice().sort(function(a,b){return b.from.localeCompare(a.from);}).map(function(v){
            var act=activeV&&activeV.id===v.id,fut=v.from>today;
            return (
              <div key={v.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #f1f5f9",fontSize:13}}>
                <span>Desde <b>{fmtS(v.from)}</b></span>
                {act&&<span style={{fontSize:10,background:"#dcfce7",color:"#166534",padding:"1px 7px",borderRadius:8,fontWeight:700}}>Vigente</span>}
                {fut&&<span style={{fontSize:10,background:"#e0f2fe",color:"#0369a1",padding:"1px 7px",borderRadius:8,fontWeight:700}}>Programada</span>}
                <span style={{fontSize:11,color:"#94a3b8"}}>guardada el {fmtS(v.created)}</span>
                <button style={Object.assign({},S.btnS,{padding:"2px 8px",fontSize:11,marginLeft:"auto"})} onClick={function(){load(v);}}>Cargar</button>
                <button style={Object.assign({},S.btnD,{padding:"2px 8px",fontSize:11})} onClick={function(){delV(v);}}>Eliminar</button>
              </div>
            );
          });

          return (
            <div style={{padding:"16px 12px"}}>
              <div style={{maxWidth:1040,margin:"0 auto"}}>
                <h2 style={Object.assign({},S.h2,{marginBottom:4})}>Semana tipo</h2>
                <p style={{fontSize:13,color:"#475569",margin:"0 0 14px",maxWidth:760}}>Actividad habitual del equipo. {abOn?"Se replica automáticamente todas las semanas, alternando A y B"+(abOff?" (hasta el "+fmtS(abOff)+"; desde entonces, un solo tipo de semana).":"."):"Se replica automáticamente todas las semanas (un solo tipo de semana desde el "+(abOff>"2000-12-31"?fmtS(abOff):"inicio")+")."} Los cambios que hagas aquí se aplican a partir de la fecha que indiques; los cambios puntuales hechos en el dashboard para un día concreto se mantienen.</p>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:12,marginBottom:14}}>
                  {abOn&&(
                  <div style={{display:"flex",gap:6}}>
                    <button style={Object.assign({},S.fChip,{fontSize:13,padding:"5px 14px",background:wk==="A"?"#3b82f6":"#f1f5f9",color:wk==="A"?"#fff":"#475569",borderColor:wk==="A"?"#3b82f6":"#e2e8f0"})} onClick={function(){setWk("A");}}>Semana A</button>
                    <button style={Object.assign({},S.fChip,{fontSize:13,padding:"5px 14px",background:wk==="B"?"#8b5cf6":"#f1f5f9",color:wk==="B"?"#fff":"#475569",borderColor:wk==="B"?"#8b5cf6":"#e2e8f0"})} onClick={function(){setWk("B");}}>Semana B</button>
                  </div>
                  )}
                  <span style={{fontSize:12,color:"#64748b"}}>Editando: {srcLbl}{dirty?" (con cambios sin guardar)":""}</span>
                  <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
                    <div><label style={S.lbl}>Aplicar a partir de</label><input type="date" style={Object.assign({},S.inp,{width:160})} value={from} onChange={function(e){setFrom(e.target.value);}}/></div>
                    <button style={Object.assign({},S.btnP,dirty?{}:{opacity:0.6})} onClick={save}>Guardar semana tipo</button>
                  </div>
                </div>
                {msg&&<div style={msg.e?S.err:S.ok}>{msg.t}</div>}
              </div>
              <div style={{overflowX:"auto"}}>
                <div style={Object.assign({},S.dGrid,{margin:"0 auto"})}>{cols}</div>
              </div>
              <div style={{maxWidth:1040,margin:"20px auto 0",background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14}}>
                <div style={{display:"flex",alignItems:"center",marginBottom:6}}>
                  <h3 style={{fontSize:15,fontWeight:700,margin:0}}>Versiones guardadas</h3>
                  <button style={Object.assign({},S.btnS,{padding:"3px 10px",fontSize:12,marginLeft:"auto"})} onClick={function(){load(null);}}>Cargar estructura original</button>
                </div>
                {vers}
                {tps.length===0&&<div style={{fontSize:12,color:"#94a3b8",padding:"6px 0"}}>Todavía no hay versiones guardadas: se usa la estructura original.</div>}
              </div>
            </div>
          );
        }

        function ABModal({abr,abOff,setAbOff,onSave,onClose}){
          var nmo=mon(new Date());nmo.setDate(nmo.getDate()+7);
          var [mode,setMode]=useState(abOff?"off":"on");
          var [offD,setOffD]=useState(abOff&&abOff>"2000-12-31"?abOff:ld(nmo));
          var tm=ld(mon(new Date()));
          var [d,setD]=useState(tm),[t,setT]=useState("A");
          var prop=abr.filter(function(r){return r.date!==d;}).concat([{date:d,type:t}]);
          var prev=[0,1,2,3,4].map(function(i){var nd=new Date();nd.setDate(nd.getDate()+i*7);var ds=ld(mon(nd));return{ds:ds,wt:calcWT(prop,ds)};});
          var prevRows=prev.map(function(x,i){
            return (
              <div key={x.ds} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,marginBottom:3}}>
                <span style={{color:"#475569"}}>{i===0?"Esta semana":i===1?"Próxima":"+"+(i)+"s"} ({x.ds})</span>
                <span style={{fontWeight:700,padding:"1px 10px",borderRadius:10,color:"#fff",background:x.wt==="A"?"#3b82f6":"#8b5cf6"}}>Sem. {x.wt}</span>
              </div>
            );
          });
          var histRows=abr.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(r){
            return <div key={r.date} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#78350f",padding:"2px 0"}}><span>Desde {r.date}</span><span style={{fontWeight:700,padding:"0 8px",borderRadius:8,color:"#fff",background:r.type==="A"?"#3b82f6":"#8b5cf6"}}>Sem. {r.type}</span></div>;
          });
          return (
            <div style={S.overlay}>
              <div style={Object.assign({},S.modal,{maxWidth:500})}>
                <h3 style={{fontSize:17,fontWeight:700,margin:"0 0 4px",color:"#0f172a"}}>Configurar semana A/B</h3>
                <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                  <LChip on={mode==="on"} onClick={function(){setMode("on");}}>Semanas A y B alternas</LChip>
                  <LChip on={mode==="off"} onClick={function(){setMode("off");}}>Desactivar a partir de una fecha</LChip>
                </div>
                {abOff&&<div style={Object.assign({},S.ok,{background:"#eef2ff",color:"#3730a3",borderColor:"#c7d2fe"})}>{abOff>"2000-12-31"?"Ahora mismo: A/B activas hasta la semana anterior al "+fmtS(abOff)+"; desde esa semana, un solo tipo.":"Ahora mismo: A/B desactivadas en todas las semanas."}</div>}
                {mode==="off"&&(
                  <div>
                    <div style={{marginBottom:10}}><label style={S.lbl}>Un solo tipo de semana a partir del lunes</label><input type="date" style={S.inp} value={offD} onChange={function(e){if(!e.target.value)return;setOffD(ld(mon(pl(e.target.value))));}}/></div>
                    <p style={{fontSize:12,color:"#475569",margin:"0 0 10px",lineHeight:1.5}}>Las semanas anteriores al {fmtS(offD)} se quedan exactamente como están, con su alternancia A/B. Desde esa semana todas usan la misma estructura: la de <b>Semana tipo</b> (parte de la antigua semana A). Para cambiarla, guarda en Semana tipo una versión que se aplique desde el {fmtS(offD)}.</p>
                    {offD<ld(mon(new Date()))&&<div style={Object.assign({},S.err,{background:"#fffbeb",color:"#92400e",borderColor:"#fcd34d"})}>Atención: la fecha es anterior a esta semana, así que también cambiarán semanas pasadas.</div>}
                    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                      <button style={S.btnS} onClick={onClose}>Cancelar</button>
                      <button style={S.btnP} onClick={function(){setAbOff(offD);onClose();}}>Aplicar</button>
                    </div>
                  </div>
                )}
                {mode==="on"&&abOff&&(
                  <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
                    <button style={Object.assign({},S.btnS,{borderColor:"#93c5fd",color:"#1d4ed8"})} onClick={function(){setAbOff("");onClose();}}>Volver a activar A/B en todas las semanas</button>
                  </div>
                )}
                {mode==="on"&&<div>
                <p style={{fontSize:12,color:"#64748b",marginBottom:16}}>El nuevo ajuste se aplica desde el lunes elegido hacia adelante.</p>

        function ImgVisor({url,label,onClose}){
          var [scale,setScale]=useState(1);
          var [offset,setOffset]=useState({x:0,y:0});
          var last=useRef(null);
          var lastDist=useRef(null);
          var lastOffset=useRef({x:0,y:0});
          var lastScale=useRef(1);
          var imgRef=useRef(null);

          function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
          function mid(t){return{x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}

          function onTouchStart(e){
            if(e.touches.length===2){
              lastDist.current=dist(e.touches);
              lastScale.current=scale;
              lastOffset.current=offset;
            } else if(e.touches.length===1){
              last.current={x:e.touches[0].clientX-offset.x,y:e.touches[0].clientY-offset.y};
            }
          }
          function onTouchMove(e){
            e.preventDefault();
            if(e.touches.length===2){
              var d=dist(e.touches);
              var ns=Math.min(8,Math.max(0.5,lastScale.current*(d/lastDist.current)));
              setScale(ns);
            } else if(e.touches.length===1&&last.current){
              setOffset({x:e.touches[0].clientX-last.current.x,y:e.touches[0].clientY-last.current.y});
            }
          }
          function onTouchEnd(e){if(e.touches.length<2)lastDist.current=null;}

          function onWheel(e){
            e.preventDefault();
            var ns=Math.min(8,Math.max(0.5,scale*(e.deltaY<0?1.12:0.89)));
            setScale(ns);
          }
          function onMouseDown(e){last.current={x:e.clientX-offset.x,y:e.clientY-offset.y};}
          function onMouseMove(e){if(!last.current||e.buttons!==1)return;setOffset({x:e.clientX-last.current.x,y:e.clientY-last.current.y});}
          function onMouseUp(){last.current=null;}

          function doDownload(){
            var a=document.createElement("a");a.href=url;a.download="planificacion-"+label+".png";
            document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},200);
          }
          function resetView(){setScale(1);setOffset({x:0,y:0});}

          return (
            <div style={{position:"fixed",inset:0,background:"#000",zIndex:1500,display:"flex",flexDirection:"column",userSelect:"none"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",background:"rgba(0,0,0,0.85)",flexShrink:0,gap:8}}>
                <span style={{color:"#fff",fontWeight:700,fontSize:14,fontFamily:"Arial,sans-serif"}}>Planificación {label}</span>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{color:"#94a3b8",fontSize:12,fontFamily:"Arial,sans-serif"}}>{Math.round(scale*100)}%</span>
                  <button onClick={resetView} style={{background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",padding:"6px 12px",borderRadius:7,cursor:"pointer",fontSize:12,fontFamily:"Arial,sans-serif"}}>1:1</button>
                  <button onClick={doDownload} style={{background:"#3b82f6",border:"none",color:"#fff",padding:"6px 14px",borderRadius:7,cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"Arial,sans-serif"}}>Descargar PNG</button>
                  <button onClick={onClose} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",padding:"6px 12px",borderRadius:7,cursor:"pointer",fontSize:18,lineHeight:1,fontFamily:"Arial,sans-serif"}}>✕</button>
                </div>
              </div>
              <div style={{flex:1,overflow:"hidden",position:"relative",touchAction:"none"}}
                onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                onWheel={onWheel} onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp}>
                <img ref={imgRef} src={url} alt="planificacion"
                  style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%) translate("+offset.x+"px,"+offset.y+"px) scale("+scale+")",transformOrigin:"center center",maxWidth:"none",cursor:scale>1?"grab":"zoom-in",imageRendering:"crisp-edges"}}
                  draggable={false}/>
              </div>
              <div style={{padding:"8px 16px",background:"rgba(0,0,0,0.7)",textAlign:"center",flexShrink:0}}>
                <span style={{color:"#64748b",fontSize:11,fontFamily:"Arial,sans-serif"}}>Pellizca para ampliar · Arrastra para mover · Rueda del ratón para zoom · Descarga y comparte por WhatsApp</span>
              </div>
            </div>
          );
        }
